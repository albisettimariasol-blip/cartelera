<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cartelera ISFD 19</title>
    
    <!-- Scripts Externos (Gratuitos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-nacional {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background: linear-gradient(180deg, #e0f2fe 0%, #ffffff 100%);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .dia-activo { 
            background: #0ea5e9; 
            color: white !important; 
            transform: scale(1.05); 
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.4); 
        }
        .card-aula { 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .card-aula:active { transform: scale(0.96); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div class="bg-nacional"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 🔗 LINK DE TU GOOGLE SHEETS (IMPORTANTE: Debe terminar en output=csv)
        // Para probar, podés dejar este link de ejemplo o poner el tuyo.
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSXXXXXXXXXXXX/pub?output=csv";

        function App() {
            const [datos, setDatos] = useState([]);
            const [diaActual, setDiaActual] = useState("");
            const [busqueda, setBusqueda] = useState("");
            const [cargando, setCargando] = useState(true);
            const [error, setError] = useState(false);

            useEffect(() => {
                const hoy = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"][new Date().getDay()];
                setDiaActual(hoy === "Domingo" ? "Lunes" : hoy);
                fetchData();
            }, []);

            const fetchData = () => {
                setCargando(true);
                Papa.parse(SHEET_URL, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        setDatos(results.data);
                        setCargando(false);
                        setError(false);
                    },
                    error: () => {
                        setError(true);
                        setCargando(false);
                    }
                });
            };

            const filtrados = useMemo(() => {
                return datos.filter(h => {
                    const matchDia = h.Día?.toLowerCase().trim() === diaActual.toLowerCase().trim();
                    const matchBusqueda = 
                        h.Materia?.toLowerCase().includes(busqueda.toLowerCase()) || 
                        h.Carrera?.toLowerCase().includes(busqueda.toLowerCase()) ||
                        h.Aula?.toLowerCase().includes(busqueda.toLowerCase());
                    return matchDia && matchBusqueda;
                });
            }, [datos, diaActual, busqueda]);

            return (
                <div className="max-w-md mx-auto min-h-screen px-4 pb-12 pt-6">
                    {/* Header Institucional */}
                    <div className="flex items-center gap-4 mb-8">
                        <div className="w-14 h-14 bg-sky-600 rounded-2xl flex items-center justify-center shadow-xl shadow-sky-200">
                            <i className="fa-solid fa-graduation-cap text-white text-2xl"></i>
                        </div>
                        <div>
                            <h1 className="text-2xl font-black text-sky-900 tracking-tight leading-none uppercase italic">ISFD 19</h1>
                            <p className="text-[10px] font-bold text-sky-500 uppercase tracking-[0.2em] mt-1">Cartelera Gratuita</p>
                        </div>
                        <button 
                            onClick={fetchData} 
                            className="ml-auto w-10 h-10 rounded-full bg-white text-sky-400 shadow-sm border border-slate-100 flex items-center justify-center active:rotate-180 transition-transform duration-500"
                        >
                            <i className={`fa-solid fa-sync-alt ${cargando ? 'animate-spin' : ''}`}></i>
                        </button>
                    </div>

                    {/* Buscador Pro */}
                    <div className="relative mb-8">
                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i className="fa-solid fa-search text-sky-300"></i>
                        </div>
                        <input 
                            type="text"
                            placeholder="Buscar materia, carrera o aula..."
                            className="w-full h-16 pl-12 pr-4 bg-white rounded-3xl border-none shadow-lg shadow-sky-100/50 outline-none focus:ring-2 focus:ring-sky-400 transition-all font-semibold text-slate-700"
                            value={busqueda}
                            onChange={(e) => setBusqueda(e.target.value)}
                        />
                    </div>

                    {/* Selector de Días (Deslizable) */}
                    <div className="flex gap-2 overflow-x-auto no-scrollbar mb-8 pb-2">
                        {["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"].map(d => (
                            <button 
                                key={d}
                                onClick={() => setDiaActual(d)}
                                className={`px-6 py-3 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all shrink-0 ${diaActual === d ? 'dia-activo' : 'bg-white text-slate-400 border border-slate-100 shadow-sm'}`}
                            >
                                {d}
                            </button>
                        ))}
                    </div>

                    {/* Lista de Resultados */}
                    <div className="space-y-4">
                        {cargando ? (
                            <div className="text-center py-20 flex flex-col items-center">
                                <div className="w-12 h-12 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                <p className="text-xs font-black text-sky-400 uppercase tracking-[0.2em]">Conectando con Excel...</p>
                            </div>
                        ) : error ? (
                            <div className="bg-red-50 text-red-500 p-8 rounded-[2.5rem] text-center border border-red-100 shadow-xl shadow-red-50">
                                <i className="fa-solid fa-circle-exclamation text-3xl mb-3"></i>
                                <p className="text-sm font-bold uppercase tracking-tight">Error de Conexión</p>
                                <p className="text-[10px] font-medium mt-1 opacity-70">Verifica que el Google Sheets esté "Publicado en la Web".</p>
                            </div>
                        ) : filtrados.length > 0 ? (
                            filtrados.map((h, i) => (
                                <div key={i} className="card-aula bg-white p-6 rounded-[2rem] flex justify-between items-center shadow-sm hover:shadow-md anim-fade" style={{animationDelay: `${i*0.05}s`}}>
                                    <div className="flex-1 pr-4">
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className="text-[9px] font-black bg-sky-100 text-sky-700 px-2.5 py-1 rounded-lg uppercase tracking-tighter">
                                                {h.Carrera || 'GRAL'}
                                            </span>
                                            <span className="text-[9px] font-bold text-slate-400">
                                                <i className="fa-regular fa-clock mr-1"></i>{h.Horario || '--:--'}
                                            </span>
                                        </div>
                                        <h3 className="text-lg font-extrabold text-slate-800 uppercase leading-none tracking-tight">
                                            {h.Materia}
                                        </h3>
                                    </div>
                                    <div className="flex flex-col items-center justify-center min-w-[75px] h-[75px] rounded-2xl bg-sky-50 text-sky-600 border border-sky-100 shadow-inner">
                                        <span className="text-[8px] font-black uppercase opacity-60 tracking-widest mb-1">AULA</span>
                                        <span className="text-3xl font-black leading-none">{h.Aula}</span>
                                    </div>
                                </div>
                            ))
                        ) : (
                            <div className="py-20 text-center bg-white/50 rounded-[3rem] border-2 border-dashed border-sky-100 anim-fade">
                                <i className="fa-solid fa-calendar-day text-sky-200 text-5xl mb-4"></i>
                                <p className="text-xs font-black text-sky-300 uppercase tracking-[0.3em]">Sin clases para mostrar</p>
                            </div>
                        )}
                    </div>

                    {/* Footer Fijo */}
                    <div className="mt-12 text-center">
                        <p className="text-[9px] font-black text-slate-300 uppercase tracking-[0.4em]">Actualización Automática vía Sheets</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
