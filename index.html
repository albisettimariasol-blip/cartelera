<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Centro de Estudiantes ISFD 19 - Cartelera</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #030712; 
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .card-student {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .shimmer {
            background: linear-gradient(90deg, #030712 25%, #111827 50%, #030712 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ig-gradient {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Configuración de la URL del CSV (Google Sheets publicado como CSV)
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_REEMPLAZA_ESTO_CON_TU_ID/pub?output=csv";
        const INSTAGRAM_USER = "centroestudiantes_19";

        function App() {
            const [rows, setRows] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [filtroDia, setFiltroDia] = useState("");

            const diasSemana = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

            useEffect(() => {
                const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
                const hoy = dias[new Date().getDay()];
                setFiltroDia(hoy === "Domingo" ? "Lunes" : hoy);
                fetchData();
            }, []);

            const fetchData = () => {
                setLoading(true);
                setError(null);
                
                const cacheBuster = `&t=${new Date().getTime()}`;
                
                Papa.parse(GOOGLE_SHEET_CSV_URL + cacheBuster, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            setRows(results.data);
                        } else {
                            setError("No se encontraron datos. Verificá que el link sea de un CSV público.");
                        }
                        setLoading(false);
                    },
                    error: (err) => {
                        setError("Error al conectar con Google Sheets.");
                        setLoading(false);
                    }
                });
            };

            const filteredData = useMemo(() => {
                return rows.filter(r => {
                    const d = (r.Día || r.dia || r.DIA || "").trim().toLowerCase();
                    return d === filtroDia.toLowerCase();
                });
            }, [rows, filtroDia]);

            return (
                <div className="min-h-screen pb-20 flex flex-col">
                    <header className="p-6 pt-10 sticky top-0 z-10 bg-[#030712]/90 backdrop-blur-xl border-b border-blue-900/20">
                        <div className="max-w-xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-black tracking-tight text-white leading-tight">
                                    CENTRO DE <span className="gradient-text">ESTUDIANTES</span>
                                </h1>
                                <p className="text-slate-500 text-[10px] font-bold uppercase tracking-widest mt-0.5">ISFD 19 • Cartelera</p>
                            </div>
                            <div className="flex gap-2">
                                <a href={`https://instagram.com/${INSTAGRAM_USER}`} target="_blank" className="w-10 h-10 rounded-xl ig-gradient flex items-center justify-center text-white shadow-lg">
                                    <i className="fa-brands fa-instagram text-lg"></i>
                                </a>
                                <button onClick={fetchData} className="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center border border-slate-700">
                                    <i className={`fa-solid fa-sync text-slate-300 text-xs ${loading ? 'animate-spin' : ''}`}></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-xl mx-auto px-6 mt-6 flex-grow w-full">
                        <div className="flex gap-2 overflow-x-auto no-scrollbar mb-8 py-2">
                            {diasSemana.map(d => (
                                <button key={d} onClick={() => setFiltroDia(d)}
                                    className={`px-5 py-3 rounded-2xl text-[11px] font-black uppercase tracking-wider transition-all shrink-0 border-2 ${
                                        filtroDia === d ? 'bg-blue-600 border-blue-400 text-white shadow-lg' : 'bg-slate-900/50 border-transparent text-slate-500'
                                    }`}>
                                    {d}
                                </button>
                            ))}
                        </div>

                        {error ? (
                            <div className="bg-red-500/10 border border-red-500/20 p-6 rounded-3xl text-center">
                                <h3 className="text-white font-bold mb-2">Error</h3>
                                <p className="text-slate-400 text-xs mb-4">{error}</p>
                                <button onClick={fetchData} className="text-blue-400 font-black text-[10px] uppercase tracking-widest">Reintentar</button>
                            </div>
                        ) : loading ? (
                            <div className="grid gap-4">
                                {[1,2,3].map(i => <div key={i} className="h-24 rounded-[2rem] shimmer opacity-20"></div>)}
                            </div>
                        ) : filteredData.length > 0 ? (
                            <div className="grid gap-4">
                                {filteredData.map((item, i) => (
                                    <div key={i} className="card-student p-5 rounded-[2rem] flex justify-between items-center">
                                        <div className="flex-1 pr-4">
                                            <span className="text-blue-400 text-[9px] font-black uppercase tracking-widest block mb-1">
                                                {item.Carrera || item.carrera || "Carrera"}
                                            </span>
                                            <h3 className="text-[15px] font-extrabold text-white uppercase leading-tight mb-2">
                                                {item.Materia || item.materia || "Materia"}
                                            </h3>
                                            <div className="flex items-center gap-2 text-slate-400">
                                                <i className="fa-regular fa-clock text-[10px]"></i>
                                                <span className="text-[10px] font-bold">{item.Horario || item.horario || ""}</span>
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-center justify-center min-w-[65px] h-[65px] bg-slate-800/80 rounded-2xl border border-slate-700">
                                            <span className="text-[8px] font-black text-slate-500 uppercase">Aula</span>
                                            <span className="text-2xl font-black text-blue-400 leading-none">{item.Aula || item.aula || "-"}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="py-20 text-center opacity-40">
                                <p className="text-xs font-bold uppercase tracking-widest">No hay clases hoy</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
